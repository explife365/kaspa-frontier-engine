<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Galleon DEX — gTEST / wiKAS</title>
  <style>
    :root { --bg:#0b0f14; --card:#141c26; --border:#2a3a50; --text:#e8eef7; --muted:#8b9cb3; --accent:#70e0a8; --warn:#f5a623; --font:system-ui,sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:var(--font); background:var(--bg); color:var(--text); min-height:100vh; }
    header { padding:1.5rem 2rem; border-bottom:1px solid var(--border); }
    h1 { margin:0 0 .35rem; font-size:1.35rem; }
    .sub { color:var(--muted); font-size:.9rem; max-width:520px; }
    main { max-width:440px; margin:2rem auto; padding:0 1rem 3rem; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1.25rem; }
    label { display:block; font-size:.75rem; color:var(--muted); margin-bottom:.35rem; text-transform:uppercase; letter-spacing:.04em; }
    input, select { width:100%; padding:.65rem .75rem; border-radius:8px; border:1px solid var(--border); background:#0a1018; color:var(--text); font-size:1rem; margin-bottom:1rem; }
    .row { display:flex; gap:.75rem; align-items:end; }
    .row > div { flex:1; }
    button { width:100%; padding:.75rem; border:none; border-radius:8px; background:var(--accent); color:#0b0f14; font-weight:600; font-size:1rem; cursor:pointer; margin-top:.5rem; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .stats { margin-top:1.25rem; font-size:.85rem; color:var(--muted); line-height:1.6; }
    .stats strong { color:var(--text); }
    .warn { color:var(--warn); font-size:.8rem; margin-top:1rem; }
    #err { color:#ff6b6b; font-size:.85rem; margin-top:.75rem; }
    .flip { text-align:center; margin:.5rem 0; color:var(--muted); font-size:.8rem; cursor:pointer; }
  </style>
</head>
<body>
  <header>
    <h1>Galleon DEX</h1>
    <p class="sub">Constant-product swap on Galleon testnet (gTEST ↔ wiKAS). Quotes via local integrator API — run <code>python examples/galleon_dex.py serve</code> first.</p>
  </header>
  <main>
    <div class="card">
      <div class="row">
        <div>
          <label>You sell</label>
          <input id="amountIn" type="number" step="any" min="0" value="1" />
        </div>
        <div>
          <label>Token</label>
          <select id="dir">
            <option value="gTEST-wiKAS">gTEST → wiKAS</option>
            <option value="wiKAS-gTEST">wiKAS → gTEST</option>
          </select>
        </div>
      </div>
      <button id="quoteBtn" type="button">Get quote</button>
      <div class="stats" id="stats">Loading pool…</div>
      <p class="warn">Rehearsal only. gTEST is not USD. Swaps are CLI: <code>galleon_dex.py swap --broadcast</code>.</p>
      <div id="err"></div>
    </div>
  </main>
  <script>
    const API = "http://127.0.0.1:8787";
    const statsEl = document.getElementById("stats");
    const errEl = document.getElementById("err");

    async function loadStatus() {
      try {
        const r = await fetch(API + "/v1/dex/status");
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || r.statusText);
        const p = j.pair;
        statsEl.innerHTML = `<strong>Pool</strong> ${j.pool_kind}<br>`
          + `<strong>Reserves</strong> ${j.reserves.human0.toFixed(2)} ${p.token0.symbol} / ${j.reserves.human1.toFixed(6)} ${p.token1.symbol}<br>`
          + `<strong>Price</strong> ${j.price_token1_per_token0.toFixed(8)} wiKAS per gTEST<br>`
          + `<strong>Fee</strong> ${j.fee_bps} bps`;
      } catch (e) {
        statsEl.textContent = "Start API: python examples/galleon_dex.py serve";
        errEl.textContent = String(e);
      }
    }

    async function quote() {
      errEl.textContent = "";
      const sell = document.getElementById("amountIn").value;
      const dir = document.getElementById("dir").value;
      const buy = dir.startsWith("gTEST") ? "wiKAS" : "gTEST";
      try {
        const r = await fetch(API + `/v1/dex/quote?sell=${encodeURIComponent(sell)}&buy=${buy}`);
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || r.statusText);
        statsEl.innerHTML = `<strong>Quote</strong> ${j.amount_in_human} ${j.token_in} → ${j.amount_out_human.toFixed(8)} ${j.token_out}<br>`
          + `<strong>Min out</strong> ${j.min_out_human.toFixed(8)} (${j.slippage_bps} bps slippage)<br>`
          + `<strong>Fee</strong> ${j.fee_bps} bps`;
      } catch (e) {
        errEl.textContent = String(e);
      }
    }

    document.getElementById("quoteBtn").addEventListener("click", quote);
    loadStatus();
  </script>
</body>
</html>
