# Igra Galleon testnet (chain 38836). EVM DeFi lives here, not on kaspad.
# Docs: https://igra-labs.gitbook.io/igralabs-docs/quickstart/deploy-your-first-contract

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
fuzz = { runs = 256 }
invariant = { runs = 64 }

[rpc_endpoints]
galleon_testnet = "https://galleon-testnet.igralabs.com:8545"
igra_mainnet = "https://rpc.igralabs.com:8545"

[etherscan]
galleon_testnet = { key = "no-api-key-needed", url = "https://explorer.galleon-testnet.igralabs.com/api", chain = 38836 }
igra_mainnet = { key = "no-api-key-needed", url = "https://explorer.igralabs.com/api", chain = 38833 }
